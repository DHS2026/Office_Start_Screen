<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dhainagar High School (H.S.) - Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1c1c1c; 
        }

        /* 🟢 WRAPPER TRICK: APK-তে ব্যানার পার্মানেন্টলি হাইড করার জন্য 🟢 */
        .iframe-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* ফ্রেমের বাইরের অংশ কেটে ফেলবে */
            z-index: 1;
        }

        #app-iframe {
            position: absolute;
            top: -45px; 
            left: 0;
            width: 100%;
            height: calc(100% + 45px); 
            border: none;
        }

        /* 🟢 SPLASH SCREEN STYLES 🟢 */
        .splash-container {
            position: fixed; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%; /* 100vh এর বদলে 100% ব্যবহার করা হলো APK-এর জন্য */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999; 
            background-color: #0b1b2b; /* ব্যাকআপ কালার */
            transition: opacity 0.8s ease-in-out, visibility 0.8s ease-in-out;
        }

        .splash-container.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 27, 43, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .school-logo {
            width: 25vw;
            max-width: 100px;
            min-width: 75px;
            height: 25vw;
            max-height: 100px;
            min-height: 75px;
            border-radius: 50%;
            border: 3px solid #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            object-fit: contain;
            background: #fff;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(0, 240, 255, 0.9); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.5); }
        }

        h1 {
            color: #ffffff;
            font-size: clamp(18px, 4vw, 24px);
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            width: 100%;
        }

        h3 {
            color: #ffcc00;
            font-size: clamp(13px, 3vw, 15px);
            margin-bottom: 25px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            width: 100%;
        }

        #loaderBox {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #00f0ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #00f0ff;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- 🟢 Iframe Wrapper (APK ব্যানার ট্রিক) 🟢 -->
    <div class="iframe-wrapper">
        <!-- শুরুতে src খালি থাকবে, জাভাস্ক্রিপ্ট দিয়ে পরে বসানো হবে -->
        <iframe id="app-iframe" src=""></iframe>
    </div>

    <!-- 🟢 স্প্ল্যাশ স্ক্রিন 🟢 -->
    <div class="splash-container" id="splashScreen">
        <!-- APK তে ছবি না পাওয়ার সমস্যা এড়াতে ডিরেক্ট গুগল ড্রাইভের লোগো লিংক ব্যবহার করা হলো -->
        <div class="overlay">
            <img src="https://lh3.googleusercontent.com/d/1D14yBJkfI1cTPJ0hpfcYH9qKB16wMo4N" alt="School Logo" class="school-logo">
            
            <h1>DHAINAGAR HIGH SCHOOL (H.S.)</h1>
            <h3>Salary Update System</h3>

            <div id="loaderBox">
                <div class="spinner"></div>
                <div class="loading-text" id="statusText">Connecting to Portal...</div>
            </div>
        </div>
    </div>

    <script>
        const iframe = document.getElementById('app-iframe');
        const splashScreen = document.getElementById('splashScreen');
        const statusText = document.getElementById('statusText');
        
        // আপনার Google Apps Script এর লিংক
        const appsScriptUrl = "https://script.google.com/macros/s/AKfycbwacHgwSi_SEIWXoI3uLcPv5wj8SSha40cwnJCJ_AoBCMxGFGz9-uFtoMbMWWUp7N60/exec";
        
        let isAppLoaded = false;

        function removeSplashScreen() {
            if (isAppLoaded) return; 
            isAppLoaded = true;
            
            statusText.innerText = "Portal Loaded Successfully!";
            
            setTimeout(() => {
                splashScreen.classList.add('fade-out');
            }, 300);

            setTimeout(() => {
                splashScreen.style.display = 'none';
            }, 1100);
        }

        // পেজ লোড হওয়ার পর (Delay Iframe Load)
        // এতে APK স্প্ল্যাশ স্ক্রিনটিকে ব্ল্যাঙ্ক না করে সাথে সাথে স্ক্রিনে দেখাবে
        window.onload = () => {
            setTimeout(() => {
                iframe.src = appsScriptUrl; // হাফ সেকেন্ড পর আইফ্রেম লোড শুরু হবে
            }, 500);
        };

        // আইফ্রেম নিজে থেকে লোড কমপ্লিট হলে
        iframe.onload = function() {
            // যদি src খালি না থাকে (মানে গুগল স্ক্রিপ্ট লোড হয়েছে)
            if(iframe.src !== "" && iframe.src !== window.location.href) {
                setTimeout(removeSplashScreen, 1000);
            }
        };

        // ফেলসেফ: নেটওয়ার্ক স্লো থাকলে
        setTimeout(() => {
            if (!isAppLoaded) {
                statusText.innerText = "Network is slow, still loading...";
            }
        }, 5000);

        // ফেলসেফ: ১২ সেকেন্ড পর জোর করে স্প্ল্যাশ স্ক্রিন সরিয়ে দেওয়া
        setTimeout(() => {
            if (!isAppLoaded) {
                statusText.innerText = "Forcing entry...";
                removeSplashScreen();
            }
        }, 12000);

    </script>
</body>
</html>
