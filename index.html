<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhainagar High School (H.S.) - Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .splash-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: url('https://lh3.googleusercontent.com/d/1D14yBJkfI1cTPJ0hpfcYH9qKB16wMo4N') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 27, 43, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }

        .school-logo {
            width: 25vw;
            max-width: 100px;
            min-width: 75px;
            height: 25vw;
            max-height: 100px;
            min-height: 75px;
            border-radius: 50%;
            border: 3px solid #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            object-fit: contain;
            background: #fff;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(0, 240, 255, 0.9); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.5); }
        }

        h1 {
            color: #ffffff;
            font-size: clamp(18px, 4vw, 24px);
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            width: 100%;
        }

        h3 {
            color: #ffcc00;
            font-size: clamp(13px, 3vw, 15px);
            margin-bottom: 25px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            width: 100%;
        }

        #loaderBox {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #00f0ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #00f0ff;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-align: center;
            width: 100%;
        }

        .retry-btn {
            display: none;
            margin-top: 20px;
            background-color: #ff3b3b;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 59, 59, 0.5);
            transition: 0.3s;
        }

        .retry-btn:hover {
            background-color: #ff5252;
        }
    </style>
</head>
<body>

    <div class="splash-container">
        <div class="overlay">
            <img src="https://lh3.googleusercontent.com/d/1D14yBJkfI1cTPJ0hpfcYH9qKB16wMo4N" alt="School Logo" class="school-logo">
            
            <h1>DHAINAGAR HIGH SCHOOL (H.S.)</h1>
            <h3>Salary Update System</h3>

            <div id="loaderBox">
                <div class="spinner"></div>
                <div class="loading-text" id="statusText">Connecting to Portal...</div>
            </div>

            <button class="retry-btn" id="retryBtn" onclick="checkAndRedirect()">Reload Page</button>
        </div>
    </div>

    <script>
        const targetUrl = "https://script.google.com/macros/s/AKfycbyuaWcLh_OtFt-QXH9jM3BTJAhfDjokOJj4KPtQY3E2yJ1vdG7xDw-6c37AwxowtgDP/exec";

        function checkAndRedirect() {
            const statusText = document.getElementById("statusText");
            const spinner = document.querySelector(".spinner");
            const retryBtn = document.getElementById("retryBtn");

            statusText.innerText = "Opening Portal, Please Wait...";
            retryBtn.style.display = "none";
            spinner.style.display = "block";

            fetch(targetUrl, { mode: 'no-cors' })
                .then(() => {
                    window.location.replace(targetUrl);
                })
                .catch((error) => {
                    console.log("Connection delayed:", error);
                    fallbackRedirect();
                });

            setTimeout(() => {
                window.location.replace(targetUrl);
            }, 4000);
        }

        function fallbackRedirect() {
            window.location.href = targetUrl;
        }

        window.onload = function() {
            setTimeout(checkAndRedirect, 1000);

            setTimeout(() => {
                const retryBtn = document.getElementById("retryBtn");
                const spinner = document.querySelector(".spinner");
                const statusText = document.getElementById("statusText");
                if (retryBtn) {
                    retryBtn.style.display = "block";
                    spinner.style.display = "none";
                    statusText.innerText = "Network is slow. Click below to reload:";
                }
            }, 7000);
        };
    </script>
</body>
</html>
