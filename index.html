<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dhainagar High School (H.S.) - Portals</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1b2b; 
        }

        /* 🟢 MAIN MENU STYLES 🟢 */
        .menu-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            z-index: 10;
            background: linear-gradient(135deg, #0b1b2b 0%, #1a365d 100%);
        }

        .school-logo {
            width: 25vw;
            max-width: 120px;
            min-width: 80px;
            height: 25vw;
            max-height: 120px;
            min-height: 80px;
            border-radius: 50%;
            border: 3px solid #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            object-fit: contain;
            background: #fff;
            margin-bottom: 20px;
        }

        h1 {
            color: #ffffff;
            font-size: clamp(20px, 5vw, 28px);
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        h3 {
            color: #ffcc00;
            font-size: clamp(14px, 3.5vw, 16px);
            margin-bottom: 40px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* 🟢 BUTTON STYLES 🟢 */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 350px;
        }

        .menu-btn {
            background: rgba(0, 240, 255, 0.1);
            border: 2px solid #00f0ff;
            color: #ffffff;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.2);
        }

        .menu-btn:hover, .menu-btn:active {
            background: #00f0ff;
            color: #0b1b2b;
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.6);
            transform: translateY(-2px);
        }

        /* 🟢 WRAPPER TRICK: APK-তে ব্যানার পার্মানেন্টলি হাইড করার জন্য 🟢 */
        .iframe-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            display: none; /* Initially hidden */
        }

        #app-iframe {
            position: absolute;
            top: -45px; 
            left: 0;
            width: 100%;
            height: calc(100% + 45px); 
            border: none;
            background-color: #ffffff;
        }

        /* 🟢 FLOATING HOME BUTTON 🟢 */
        .home-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: #0b1b2b;
            border: 2px solid #00f0ff;
            border-radius: 50%;
            color: #00f0ff;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
            display: none; /* Initially hidden */
        }

        /* 🟢 LOADING SCREEN STYLES 🟢 */
        .splash-container {
            position: fixed; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%; 
            display: none; /* Initially hidden, shown on click */
            justify-content: center;
            align-items: center;
            z-index: 9999; 
            background: rgba(11, 27, 43, 0.95);
            backdrop-filter: blur(5px);
            transition: opacity 0.6s ease-in-out, visibility 0.6s ease-in-out;
        }

        .splash-container.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        #loaderBox {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #00f0ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #00f0ff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 🟢 Main Menu Screen 🟢 -->
    <div class="menu-container" id="menuScreen">
        <img src="school_logo_preview.png" alt="School Logo" class="school-logo">
        <h1>DHAINAGAR HIGH SCHOOL (H.S.)</h1>
        <h3>Administrative Portals</h3>

        <div class="btn-group">
            <button class="menu-btn" onclick="openPortal('https://script.google.com/macros/s/AKfycbyoumaaaz7R3TuYgoEX4iIl_SWyHSKnMtP7TkfUC0OWlaJ8z4okD3cmzR6l-cvgaZ_Z/exec', 'Online Salary System')">
                Online Salary System
            </button>
            <button class="menu-btn" onclick="openPortal('https://script.google.com/macros/s/AKfycbypwo3k0J_jbUcXmwP250n60XNoXmLjmtpN0lP-jxo_HjKKffaQpx0jT1cEDT2rmAU/exec', 'Admission & Registration')">
                Admission & Registration Check
            </button>
        </div>
    </div>

    <!-- 🟢 Iframe Wrapper (APK ব্যানার ট্রিক) 🟢 -->
    <div class="iframe-wrapper" id="iframeWrapper">
        <iframe id="app-iframe" src=""></iframe>
    </div>

    <!-- 🟢 Floating Home Button 🟢 -->
    <div class="home-btn" id="homeBtn" onclick="goHome()" title="Back to Menu">
        🏠
    </div>

    <!-- 🟢 Loading Screen 🟢 -->
    <div class="splash-container" id="loadingScreen">
        <div id="loaderBox">
            <div class="spinner"></div>
            <div class="loading-text" id="statusText">Connecting...</div>
        </div>
    </div>

    <script>
        const iframe = document.getElementById('app-iframe');
        const loadingScreen = document.getElementById('loadingScreen');
        const statusText = document.getElementById('statusText');
        const menuScreen = document.getElementById('menuScreen');
        const iframeWrapper = document.getElementById('iframeWrapper');
        const homeBtn = document.getElementById('homeBtn');
        
        let timeout1, timeout2;

        // পোর্টাল ওপেন করার ফাংশন
        function openPortal(url, portalName) {
            // ১. লোডিং স্ক্রিন দেখান
            statusText.innerText = portalName + " Loading...";
            loadingScreen.style.display = 'flex';
            loadingScreen.classList.remove('fade-out');

            // ২. Iframe এ URL সেট করুন
            iframe.src = url;

            // ৩. Fallback টাইমআউট (যদি নেটওয়ার্ক স্লো থাকে)
            timeout1 = setTimeout(() => {
                statusText.innerText = "Network is slow, still loading...";
            }, 5000);

            timeout2 = setTimeout(() => {
                statusText.innerText = "Forcing entry...";
                hideLoadingScreen();
            }, 12000);
        }

        // Iframe সম্পূর্ণ লোড হলে এই ইভেন্ট কল হবে
        iframe.onload = function() {
            if(iframe.src !== "" && iframe.src !== window.location.href) {
                hideLoadingScreen();
            }
        };

        // লোডিং স্ক্রিন সরানোর ফাংশন
        function hideLoadingScreen() {
            clearTimeout(timeout1);
            clearTimeout(timeout2);
            
            statusText.innerText = "Loaded Successfully!";
            
            // মেইন মেনু হাইড করে Iframe শো করুন
            menuScreen.style.display = 'none';
            iframeWrapper.style.display = 'block';
            homeBtn.style.display = 'flex'; // হোম বাটন দেখান

            setTimeout(() => {
                loadingScreen.classList.add('fade-out');
            }, 300);

            setTimeout(() => {
                loadingScreen.style.display = 'none';
            }, 900);
        }

        // আবার মেইন মেনুতে ফিরে যাওয়ার ফাংশন
        function goHome() {
            iframe.src = ""; // Iframe ক্লিয়ার করুন
            iframeWrapper.style.display = 'none';
            homeBtn.style.display = 'none';
            menuScreen.style.display = 'flex';
        }
    </script>
</body>
</html>
