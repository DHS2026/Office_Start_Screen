<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dhainagar High School (H.S.) - Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1c1c1c; 
        }

        /* 🟢 IFRAME STYLES (গুগল ব্যানার লুকানোর ট্রিকসহ) 🟢 */
        #app-iframe {
            position: absolute;
            top: -45px; /* গুগলের ব্যানারটি ফ্রেমের বাইরে উপরে পাঠিয়ে দেওয়া হলো */
            left: 0;
            width: 100%;
            height: calc(100% + 45px); /* ব্যালেন্স করার জন্য উচ্চতা বাড়ানো হলো */
            border: none;
            z-index: 1; 
        }

        /* 🟢 SPLASH SCREEN STYLES 🟢 */
        .splash-container {
            position: fixed; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: url('school_logo_preview.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999; 
            transition: opacity 0.8s ease-in-out, visibility 0.8s ease-in-out;
        }

        .splash-container.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 27, 43, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }

        .school-logo {
            width: 25vw;
            max-width: 100px;
            min-width: 75px;
            height: 25vw;
            max-height: 100px;
            min-height: 75px;
            border-radius: 50%;
            border: 3px solid #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            object-fit: contain;
            background: #fff;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(0, 240, 255, 0.9); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.5); }
        }

        h1 {
            color: #ffffff;
            font-size: clamp(18px, 4vw, 24px);
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            width: 100%;
        }

        h3 {
            color: #ffcc00;
            font-size: clamp(13px, 3vw, 15px);
            margin-bottom: 25px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            width: 100%;
        }

        #loaderBox {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #00f0ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #00f0ff;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- 🟢 মূল অ্যাপ (Iframe) 🟢 -->
    <iframe id="app-iframe" src="https://script.google.com/macros/s/AKfycbznJYPe17WXEG3t2vom4SM-X4NsYHORhaGoGQY_Tkxo4UvDZ9_D-MTVhRDTKisHQUTK/exec"></iframe>

    <!-- 🟢 স্প্ল্যাশ স্ক্রিন 🟢 -->
    <div class="splash-container" id="splashScreen">
        <div class="overlay">
            <img src="school_logo_preview.png" alt="School Logo" class="school-logo">
            
            <h1>DHAINAGAR HIGH SCHOOL (H.S.)</h1>
            <h3>Salary Update System</h3>

            <div id="loaderBox">
                <div class="spinner"></div>
                <div class="loading-text" id="statusText">Connecting to Portal...</div>
            </div>
        </div>
    </div>

    <script>
        const iframe = document.getElementById('app-iframe');
        const splashScreen = document.getElementById('splashScreen');
        const statusText = document.getElementById('statusText');
        
        let isAppLoaded = false;

        // স্প্ল্যাশ স্ক্রিন সরানোর মূল ফাংশন
        function removeSplashScreen() {
            if (isAppLoaded) return; // একবার সরে গেলে আর কাজ করবে না
            isAppLoaded = true;
            
            statusText.innerText = "Portal Loaded Successfully!";
            
            setTimeout(() => {
                splashScreen.classList.add('fade-out');
            }, 300);

            setTimeout(() => {
                splashScreen.style.display = 'none';
            }, 1100);
        }

        // পদ্ধতি ১: আইফ্রেম নিজে থেকে লোড হলে (গুগলের রিডাইরেক্টের কারণে এটি একটু দেরিতে হতে পারে)
        iframe.onload = function() {
            // আইফ্রেম লোড হওয়ার পর কন্টেন্ট রেন্ডার হওয়ার জন্য আরও ১ সেকেন্ড সময় দেওয়া হলো
            setTimeout(removeSplashScreen, 1000);
        };

        // পদ্ধতি ২ (ফেলসেফ): যদি স্লো নেটওয়ার্ক থাকে
        setTimeout(() => {
            if (!isAppLoaded) {
                statusText.innerText = "Network is slow, still loading...";
            }
        }, 5000);

        // পদ্ধতি ৩ (ব্রুটফোর্স/ফেলসেফ): যদি আইফ্রেম কোনো কারণে onload সিগন্যাল দিতে ব্যর্থ হয় (অ্যাপে প্রায়ই হয়)
        // ১২ সেকেন্ড পর জোর করে স্প্ল্যাশ স্ক্রিন সরিয়ে দেওয়া হবে, যাতে ইউজার আটকে না থাকে।
        setTimeout(() => {
            if (!isAppLoaded) {
                statusText.innerText = "Forcing entry...";
                removeSplashScreen();
            }
        }, 12000);

    </script>
</body>
</html>
